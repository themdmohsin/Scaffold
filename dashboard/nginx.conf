# Scaffold dashboard — static SPA server (runs inside nginx-unprivileged, port 8080).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints asset filenames -> safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: everything else serves index.html (never cache the shell).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
