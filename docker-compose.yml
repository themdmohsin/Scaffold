# Scaffold self-hosting — ONE engine every teammate talks to.
#
#   cp engine/.env.example engine/.env    # then fill in DATABASE_URL, SUPABASE_JWT_SECRET, …
#   docker compose up -d --build          # engine :8000, dashboard :8080
#
# Default database is YOUR Supabase project (engine/.env DATABASE_URL) — nothing
# local is required. A throwaway local Postgres+pgvector is available behind the
# `local-db` profile for development/CI:
#
#   docker compose --profile local-db up -d postgres
#   # then set in engine/.env:
#   #   DATABASE_URL=postgresql+psycopg://scaffold:scaffold@postgres:5432/scaffold
#   docker compose up -d engine dashboard
#
# Full guide: docs/DEPLOYMENT.md. Operations: docs/OPERATIONS.md.
name: scaffold

services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    image: scaffold-engine:local
    # All engine configuration lives in engine/.env (never committed). The
    # `required: false` form keeps `docker compose config` working before that
    # file exists; required is supported by Docker Compose >= 2.24.
    env_file:
      - path: ./engine/.env
        required: false
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Image HEALTHCHECK hits /health (liveness). Use GET /ready (checks DB +
    # migration manifest) from your platform's readiness probe.
    stop_grace_period: 15s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Vite inlines these at BUILD time. Point VITE_ENGINE_URL at the URL
        # teammates' browsers reach the engine on (e.g. https://scaffold-api.example.com).
        VITE_ENGINE_URL: ${VITE_ENGINE_URL:-http://localhost:8000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: scaffold-dashboard:local
    ports:
      - "8080:8080"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

  # OPTIONAL local Postgres (pgvector bundled). Default is the user's Supabase.
  # Port 5433 on the host avoids clashing with any local Postgres on 5432.
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: scaffold
      POSTGRES_PASSWORD: scaffold
      POSTGRES_DB: scaffold
    ports:
      - "5433:5432"
    volumes:
      - scaffold-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaffold -d scaffold"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  scaffold-pgdata:
